<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="100%" height="100%">
  <rect width="940" height="620" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="940" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: Gitflow Hotfix Workflow Verification</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Step 1: Tagging on main -->
    <text x="24" y="66" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="66" fill="rgb(248, 250, 252)">:~/repo$ </text>
    <text x="260" y="66" fill="rgb(56, 189, 248)">git checkout main &amp;&amp; git merge --no-ff hotfix/v1.0.1</text>
    <text x="24" y="88" fill="rgb(203, 213, 225)">Merge made by the 'ort' strategy.</text>
    <text x="24" y="108" fill="rgb(34, 197, 94)">git tag -a v1.0.1 -m "Release Hotfix 1.0.1 - Masking user data"</text>

    <!-- Step 2: Merge back to develop -->
    <text x="24" y="144" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="144" fill="rgb(248, 250, 252)">:~/repo$ </text>
    <text x="260" y="144" fill="rgb(56, 189, 248)">git checkout develop &amp;&amp; git merge --no-ff hotfix/v1.0.1</text>
    <text x="24" y="166" fill="rgb(203, 213, 225)">Merge made by the 'ort' strategy.</text>
    <text x="24" y="188" fill="rgb(56, 189, 248)">git branch -d hotfix/v1.0.1</text>
    <text x="24" y="208" fill="rgb(203, 213, 225)">Deleted branch hotfix/v1.0.1 (was 3d2e1f0).</text>

    <!-- Step 3: Check branches & tags -->
    <text x="24" y="244" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="244" fill="rgb(248, 250, 252)">:~/repo$ </text>
    <text x="260" y="244" fill="rgb(56, 189, 248)">git branch -a</text>
    <text x="24" y="266" fill="rgb(34, 197, 94)">* develop</text>
    <text x="24" y="286" fill="rgb(248, 250, 252)">  main</text>

    <text x="24" y="318" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="318" fill="rgb(248, 250, 252)">:~/repo$ </text>
    <text x="260" y="318" fill="rgb(56, 189, 248)">git tag -n</text>
    <text x="24" y="340" fill="rgb(245, 158, 11)">v1.0.0          Initial stable production release</text>
    <text x="24" y="360" fill="rgb(34, 197, 94)" font-weight="bold">v1.0.1          Release Hotfix 1.0.1 - Masking user data</text>

    <!-- Step 4: git log --graph --oneline --all -->
    <text x="24" y="396" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="396" fill="rgb(248, 250, 252)">:~/repo$ </text>
    <text x="260" y="396" fill="rgb(56, 189, 248)">git log --graph --oneline --all</text>

    <text x="24" y="424" fill="#38bdf8" font-weight="bold">*   </text>
    <text x="60" y="424" fill="#f59e0b">8b9c0d1</text>
    <text x="125" y="424" fill="#38bdf8"> (HEAD -&gt; develop) </text>
    <text x="280" y="424" fill="#f8fafc">Merge hotfix/v1.0.1 into develop</text>

    <text x="24" y="446" fill="#38bdf8">|\  </text>

    <text x="24" y="468" fill="#38bdf8">| </text>
    <text x="40" y="468" fill="#22c55e" font-weight="bold">*   </text>
    <text x="60" y="468" fill="#f59e0b">6a7b8c9</text>
    <text x="125" y="468" fill="#22c55e" font-weight="bold"> (tag: v1.0.1, main) </text>
    <text x="280" y="468" fill="#f8fafc">Merge hotfix/v1.0.1 into main</text>

    <text x="24" y="490" fill="#38bdf8">| </text>
    <text x="40" y="490" fill="#ef4444">|\  </text>

    <text x="24" y="512" fill="#38bdf8">| </text>
    <text x="40" y="512" fill="#ef4444">| </text>
    <text x="56" y="512" fill="#ef4444" font-weight="bold">* </text>
    <text x="75" y="512" fill="#f59e0b">3d2e1f0</text>
    <text x="140" y="512" fill="#ef4444">fix(security): mask sensitive user profile data</text>

    <text x="24" y="534" fill="#38bdf8">* </text>
    <text x="40" y="534" fill="#ef4444">| </text>
    <text x="56" y="534" fill="#ef4444">| </text>
    <text x="75" y="534" fill="#f59e0b">2c1b0a9</text>
    <text x="140" y="534" fill="#f8fafc">feat(checkout): developing future feature on develop</text>

    <text x="24" y="556" fill="#38bdf8">| </text>
    <text x="40" y="556" fill="#22c55e" font-weight="bold">* </text>
    <text x="60" y="556" fill="#f59e0b">1a2b3c4</text>
    <text x="125" y="556" fill="#22c55e"> (tag: v1.0.0) </text>
    <text x="240" y="556" fill="#f8fafc">feat(release): initial stable release v1.0.0</text>

    <text x="24" y="588" fill="rgb(34, 197, 94)">devops@workstation</text>
    <text x="180" y="588" fill="rgb(248, 250, 252)">:~/repo$ </text>
  </g>
</svg>
